name: tch-financials-staging

services:
  staging-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tch_staging
      POSTGRES_PASSWORD: tch_staging_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tch_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tch_staging -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  tch_staging_postgres:
